# MPD configuration (user-level systemd service).
# Music library lives in ~/Music, audio goes to PipeWire via the
# pulse-compatible output (pipewire-pulse).

music_directory    "~/Music"
playlist_directory "~/.config/mpd/playlist"
db_file            "~/.config/mpd/database"
log_file           "syslog"
pid_file           "~/.config/mpd/pid"
state_file         "~/.config/mpd/state"
sticker_file       "~/.config/mpd/sticker.sql"

# PipeWire output (pipewire-pulse provides a PulseAudio-compatible API).
audio_output {
    type           "pulse"
    name           "PipeWire"
}

# Refresh the database automatically when files change in music_directory.
auto_update        "yes"
