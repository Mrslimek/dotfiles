[project]
name = "vk-bot"
version = "0.1.0"
description = "VK Bot for searching company information using Podruchniy service API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "vkbottle>=4.6.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "ty",
]
