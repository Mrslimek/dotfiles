# --- THEME SELECTOR ---

# OPTION 1: Libadwaita / Fedora Dark
$bg_color      = rgb(1e1e1e)
$fg_color      = rgb(dedede)
$accent_color  = rgb(78aeed)
$error_color   = rgb(e01b24)
$font          = Open Sans

# OPTION 2: Gruvbox Material
# $bg_color      = rgb(282828)
# $fg_color      = rgb(ebdbb2)
# $accent_color  = rgb(fabd2f)
# $error_color   = rgb(fb4934)
# $font          = Open Sans

# --- CONFIG ---

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = screenshot
    color = $bg_color
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.4
}

label {
    monitor =
    text = $TIME
    color = $fg_color
    font_size = 90
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $fg_color
    font_size = 14
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    
    outer_color = $accent_color
    inner_color = $bg_color
    font_color = $fg_color
    
    check_color = $accent_color
    fail_color = $error_color
    
    fade_on_empty = false
    placeholder_text = <span foreground="##dedede">Password...</span>
    
    hide_input = false
    position = 0, -35
    halign = center
    valign = center
}
