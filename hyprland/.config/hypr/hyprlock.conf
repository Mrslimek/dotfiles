# GRUVBOX COLORS
$bg = rgb(282828)
$fg = rgb(ebdbb2)
$red = rgb(fb4934)
$yellow = rgb(fabd2f)
$font = Open Sans

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = screenshot
    color = $bg
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.5
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 90
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $fg
    font_size = 14
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = $yellow
    inner_color = $bg
    font_color = $fg
    fade_on_empty = false
    placeholder_text = <span foreground="##ebdbb2">password...</span>
    hide_input = false
    position = 0, -35
    halign = center
    valign = center
}
