# --- THEME SELECTOR ---

# OPTION 1: Libadwaita Neutral (Grey/Graphite)
$main_bg            = rgba(1e1e1eff)
$main_bg_alt        = rgba(242424ff)
$main_fg            = rgba(ffffffff)
$active_border_1    = rgba(b0b0b0ff) 
$active_border_2    = rgba(666666ff) 
$inactive_border    = rgba(303030ff) 
$accent_color       = rgba(b0b0b0ff)
$warning_color      = rgba(f5c211ff)
$gtk_theme_env      = adw-gtk3-dark

# OPTION 2: Gruvbox Material
# $main_bg            = rgba(282828ff)
# $main_bg_alt        = rgba(1d2021ff)
# $main_fg            = rgba(d4be98ff)
# $active_border_1    = rgba(e78a4eff)
# $active_border_2    = rgba(d8a657ff)
# $inactive_border    = rgba(282828ff)
# $accent_color       = rgba(e78a4eff)
# $warning_color      = rgba(d8a657ff)
# $gtk_theme_env      = Gruvbox-Material-Dark

# --- SYSTEM ENVS ---

env = GDK_BACKEND,wayland
env = GTK_THEME,$gtk_theme_env
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland
env = ADW_DISABLE_PORTAL,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = HYPRCURSOR_THEME,adwaita

# Dark mode settings
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme '$gtk_theme_env'

# --- AUTOSTART ---

exec-once = dbus-update-activation-environment --all
exec-once = dunst
exec-once = hyprpaper
exec-once = vicinae server
exec-once = hypridle
exec-once = udiskie
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets,ssh,pkcs11
exec-once = ~/.config/hypr/scripts/battery_notify.sh
exec-once = pypr

# --- INPUT ---

input {
    kb_layout = us, ru
    kb_options = grp:win_space_toggle
    sensitivity = 0.3

    touchpad {
        # NOTE: This thing should be already set by libinput, 
        # but i just keep it to not forget that hyprland manages it too
        tap-to-click = true
        natural_scroll = true
        disable_while_typing = true
    }
}

# animations {
#     enabled = false
# }

# UX EXPERIMENT
# animations {
#     enabled = true
#     # Очень быстрые и четкие анимации (snappy)
#     animation = windows, 1, 2, default, popin 80%
#     animation = workspaces, 1, 2, default, slide
# }
animations {
    enabled = true
	# Настройка скорости: чем МЕНЬШЕ число (второй параметр), тем БЫСТРЕЕ анимация.
    # 1.0 — почти мгновенно, 2.0 — очень быстро, 5.0 — стандарт.
    
    # bezier = name, x0, y0, x1, y1 (кривая ускорения)
    bezier = quick, 0.05, 0.9, 0.1, 1.05

    # animation = название, вкл/выкл, скорость, кривая, стиль
    animation = windows, 1, 1.5, quick, popin 80%
    animation = workspaces, 1, 1.2, quick, slide
    animation = fade, 1, 1.5, quick
}

# --- LOOK & FEEL ---

general {
    border_size = 2
    gaps_in = 5
    gaps_out = 10
    
    # Используем унифицированные переменные
    col.active_border = $active_border_1 $active_border_2 45deg
    col.inactive_border = $inactive_border
}

group {
    col.border_active = $active_border_1
    col.border_inactive = $inactive_border

    groupbar {
        enabled = true
        font_family = "Open Sans"
        font_size = 10
        height = 10
        render_titles = true

        col.active = $active_border_1
        col.inactive = $main_bg_alt
        col.locked_active = $warning_color
    }
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.90
    
    blur {
        enabled = false
    }
    
    shadow {
        enabled = false
    }
}

misc {
    vfr = true
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

render {
	# TODO: Check what i can add here
}

xwayland {
    enabled = false    
}

# --- DEVICES ---

device {
    name = huion-huion-tablet_h420x-pen
    output = HDMI-A-1
}
