# HiDPI display scaling (3200x2000 @ scale 2.0).
# These variables are read by systemd at graphical session start and propagate
# to ALL processes launched via systemd --user (including vicinae/uwsm-launched
# apps like Steam, which otherwise render at 1.0x without GDK_SCALE).
#
# This complements hl.env() in hyprland.lua, which only exposes vars to
# direct Hyprland children (terminals), not to systemd-user-launched processes.
GDK_SCALE=2
