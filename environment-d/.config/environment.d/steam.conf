# Steam UI scaling for HiDPI (3200x2000 @ scale 2.0).
# Environment variable takes precedence over any launch method
# (launcher, terminal, steam:// URL, restart) and is read by systemd
# at graphical session start. This complements --forcedesktopscaling 1.5
# in the user steam.desktop override.
STEAM_FORCE_DESKTOPUI_SCALING=1.5
