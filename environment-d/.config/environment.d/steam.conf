# Steam UI scaling for HiDPI (3200x2000 @ scale 2.0).
#
# DISABLED 2026-11-13. This was a Hyprland-era hack: with force_zero_scaling
# XWayland ran at native 3200x2000, so Steam rendered tiny without a forced 1.5x.
# Under umbriel (xwayland_native_resolution = false) the compositor already
# upscales XWayland x2, and umbriel's XSETTINGS (issue #346 fix) tells Steam to
# render at scale 1. Forcing 1.5 here stacked on top: 1.5 * 2 = 3x -> huge Steam.
#
# If Steam feels too small/big: Steam Settings -> Accessibility -> UI Scale.
# STEAM_FORCE_DESKTOPUI_SCALING=1.5
